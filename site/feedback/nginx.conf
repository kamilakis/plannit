# site/feedback/nginx.conf: the one dynamic URL of a plannit site. Install on the web server as
# /etc/nginx/snippets/plannit-feedback.conf and include it inside the site's server block
# (kamihome: from sites-available/kamihome.locations). Everything else stays static.
location = /feedback/api.php {
	include snippets/fastcgi-php.conf;
	fastcgi_pass unix:/run/php/php8.2-fpm.sock;
	client_max_body_size 16k;
}
# no other PHP is ever executed or served
location ~ \.php$ { return 404; }
